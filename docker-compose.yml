name: whiteboard
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wb}
      POSTGRES_DB: ${POSTGRES_DB:-whiteboard}
    ports: ["${POSTGRES_PORT:-5442}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wb} -d ${POSTGRES_DB:-whiteboard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio12345}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-whiteboard-assets}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: build
    command: npx prisma migrate deploy
    env_file: .env
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: api
    env_file: .env
    ports: ["3001:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  collab:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: collab
    env_file: .env
    ports: ["3002:3002"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:3002
    ports: ["3000:3000"]
    environment:
      INTERNAL_API_URL: http://api:3001
    depends_on:
      - api
      - collab

volumes:
  pgdata: {}
  miniodata: {}
